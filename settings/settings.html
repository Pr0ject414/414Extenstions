<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extension Settings</title>
    <link rel="stylesheet" href="settings.css">
</head>
<body>
    <div class="settings-content-wrapper">
        <h1>Extension Settings</h1>

        <div class="tab-container">
            <nav class="tab-nav">
                <button class="tab-button active" data-tab="global-settings-tab">Global Settings</button>
                <button class="tab-button" data-tab="fab-helper-tab">FAB Helper</button>
            </nav>

            <div id="global-settings-tab" class="tab-content active">
                <div class="setting-group">
                    <h2>Global Network Settings</h2>
                    <div class="setting">
                        <label for="maxRetries">Max Retries for Network Requests:</label>
                        <input type="number" id="maxRetries" min="1" value="5">
                    </div>
                    <div class="setting">
                        <label for="initialDelayS">Initial Backoff Delay (s):</label>
                        <input type="number" id="initialDelayS" min="1" step="0.5" value="30">
                    </div>
                    <div class="setting">
                        <label for="maxDelayS">Maximum Backoff Delay (s):</label>
                        <input type="number" id="maxDelayS" min="1" step="1" value="300"> </div>
                    <button id="saveGlobalSettings">Save Global Settings</button>
                    <span id="globalStatus" class="status-message"></span>
                </div>
            </div>

            <div id="fab-helper-tab" class="tab-content">
                <div class="setting-group">
                    <h2>FAB Helper Module Settings</h2>
                    <p>Fine-tune timings and limits for FAB processing.</p>
                    <div class="setting">
                        <label for="delayBetweenVerificationChecksS">Verification Check Delay (s):</label>
                        <input type="number" id="delayBetweenVerificationChecksS" min="1" step="0.5" value="5">
                    </div>
                    <div class="setting">
                        <label for="delayBetweenTabOpenS">Tab Opening Delay (s):</label>
                        <input type="number" id="delayBetweenTabOpenS" min="0.1" step="0.1" value="2"> </div>
                    <div class="setting">
                        <label for="maxConcurrentFabTabs">Max Concurrent FAB Tabs:</label>
                        <input type="number" id="maxConcurrentFabTabs" min="1" max="10" value="2">
                    </div>
                    <div class="setting">
                        <label for="fabBrowsePageScanIntervalS">Browse Page Scan Interval (s):</label>
                        <input type="number" id="fabBrowsePageScanIntervalS" min="1" step="0.5" value="5">
                    </div>
                    <div class="setting">
                        <label for="fabFreeItemGraceCycles">Free Item Grace Cycles:</label>
                        <input type="number" id="fabFreeItemGraceCycles" min="0" step="1" value="4">
                    </div>
                    <button id="saveFabSettings">Save FAB Helper Settings</button>
                    <span id="fabStatus" class="status-message"></span>
                </div>

                <div class="setting-group">
                    <h2>Queue Item Manually (FAB Helper)</h2>
                    <p>Add a FAB product page URL to the processing queue. It will be processed according to the "Enable Queue Processing" toggle in the popup.</p>
                    <div class="setting">
                        <label for="itemQueueUrl">Product Page URL:</label>
                        <input type="text" id="itemQueueUrl" placeholder="https://www.fab.com/listings/your-item-id">
                    </div>
                    <button id="queueItemButton">Queue Item</button>
                    <span id="queueStatus" class="status-message"></span>
                </div>
            </div>
        </div>
    </div>
    <script src="settings.js"></script>
</body>
</html>
